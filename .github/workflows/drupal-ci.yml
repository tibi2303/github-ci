name: Drupal CI

on:
  workflow_call:
    inputs:
      php_versions:
        description: 'JSON array of PHP versions to test'
        type: string
        default: '["8.3"]'
      core_versions:
        description: 'JSON array of Drupal core versions to test'
        type: string
        default: '["~10.6.0", "~11.3.0", "~11.4.0"]'
      run_phpunit:
        description: 'Whether to run PHPUnit tests'
        type: boolean
        default: true
      run_phpunit_batches:
        description: 'Whether to run PHPUnit tests in parallel batches via the toolkit:test-phpunit-batches command'
        type: boolean
        default: false
      run_behat:
        description: 'Whether to run Behat tests'
        type: boolean
        default: false

jobs:
  composer-patches-compatibility:
    name: Composer Patches compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer_patches_version:
          - "^1.7"
          - "2.0.0 as 1.7.0"
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Detect root patches
        id: composer-patches
        shell: bash
        run: |
          if jq -e '
            (((.require // {}) + (."require-dev" // {})) | has("cweagans/composer-patches"))
            and
            ([((.extra.patches // {}) | .[]) | select(length > 0)] | length > 0)
          ' composer.json > /dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.composer-patches.outputs.required == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ fromJson(inputs.php_versions)[0] }}
          tools: composer:v2

      - name: Select Composer Patches version
        if: steps.composer-patches.outputs.required == 'true'
        run: |
          composer require --no-update "cweagans/composer-patches:${{ matrix.composer_patches_version }}"
          composer config --json extra.composer-exit-on-patch-failure true

      - name: Install dependencies
        if: steps.composer-patches.outputs.required == 'true'
        run: composer install --no-scripts --ansi --no-progress --no-interaction
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

  automated-tests:
    needs: [composer-patches-compatibility]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ${{ fromJson(inputs.php_versions) }}
        core_version: ${{ fromJson(inputs.core_versions) }}
    env:
      PHP_VERSION: ${{ matrix.php_version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Determine Selenium mode
        id: selenium
        run: |
          CORE="${{ matrix.core_version }}"
          # Drupal 10.x uses lullabot/php-webdriver which requires legacy
          # JSONWire protocol (w3c: false) and an older Chrome that supports it.
          if [[ "$CORE" =~ ^~10\. ]]; then
            echo "mode=legacy" >> $GITHUB_OUTPUT
          else
            echo "mode=w3c" >> $GITHUB_OUTPUT
          fi

      - name: Generate cache key
        id: cache-key
        # Include the docker-compose.yml file hash, selenium mode and week number to ensure weekly cache refresh.
        run: echo "key=docker-${{ runner.os }}-${{ matrix.php_version }}-${{ steps.selenium.outputs.mode }}-${{ hashFiles('docker-compose.yml') }}-$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Cache Docker images
        uses: actions/cache@v6
        id: docker-cache
        with:
          path: ~/docker-images.tar
          key: ${{ steps.cache-key.outputs.key }}

      - name: Pull and save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          sed -i -E 's|httpd-php:[0-9.]+-dev|httpd-php:${{ matrix.php_version }}-ci|g' docker-compose.yml
          if [ "${{ steps.selenium.outputs.mode }}" = "legacy" ]; then
            sed -i -E 's|image: selenium/standalone-chrom[a-z]*:[^ ]*|image: selenium/standalone-chrome:4.1.3-20220405|' docker-compose.yml
          fi
          docker compose pull
          docker save -o ~/docker-images.tar $(docker compose config --images)

      - name: Load Docker images from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/docker-images.tar

      - name: Modify container versions
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          sed -i -E 's|httpd-php:[0-9.]+-dev|httpd-php:${{ matrix.php_version }}-ci|g' docker-compose.yml
          if [ "${{ steps.selenium.outputs.mode }}" = "legacy" ]; then
            sed -i -E 's|image: selenium/standalone-chrom[a-z]*:[^ ]*|image: selenium/standalone-chrome:4.1.3-20220405|' docker-compose.yml
          fi

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: Configure legacy Selenium settings
        if: steps.selenium.outputs.mode == 'legacy'
        run: |
          if [ -f phpunit.xml.dist ]; then
            sed -i 's/"w3c": true/"w3c": false/g' phpunit.xml.dist
          fi
          if [ -f behat.yml.dist ]; then
            sed -i 's/w3c: true/w3c: false/' behat.yml.dist
          fi

      - name: Update composer
        run: docker compose exec -T web composer self-update --2

      - name: Build dependencies
        run: docker compose exec -T web composer require drupal/core:${{ matrix.core_version }} drupal/core-composer-scaffold:${{ matrix.core_version }} drupal/core-dev:${{ matrix.core_version }} --update-with-all-dependencies --ansi --no-progress --no-interaction

      - name: Run grumphp
        run: docker compose exec -T web ./vendor/bin/grumphp run

      - name: Run phpunit
        if: inputs.run_phpunit && !inputs.run_phpunit_batches
        run: docker compose exec -T web ./vendor/bin/phpunit

      - name: Run phpunit in parallel batches
        if: inputs.run_phpunit && inputs.run_phpunit_batches
        run: docker compose exec -T web ./vendor/bin/run toolkit:test-phpunit-batches

      - name: Archive phpunit artifacts
        if: inputs.run_phpunit && inputs.run_phpunit_batches
        uses: actions/upload-artifact@v6
        with:
          name: junit-exports-${{ matrix.core_version }}
          path: junit-export

      - name: Site install
        run: docker compose exec -T web ./vendor/bin/run drupal:site-install

      - name: Run behat
        if: inputs.run_behat
        run: docker compose exec -T web ./vendor/bin/behat --strict

  # Aggregate gate: emits a single, stable status check regardless of how many
  # matrix combinations run. This is the check name to require in the branch
  # protection rule / organisation ruleset. Do not rename it.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [composer-patches-compatibility, automated-tests]
    if: always()
    steps:
      - name: Fail if any job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
